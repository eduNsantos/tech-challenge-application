apiVersion: v1
kind: ServiceAccount
metadata:
  name: newrelic-infra
  namespace: postech
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: newrelic-infra
rules:
  - apiGroups: [""]
    resources:
      - "nodes"
      - "nodes/metrics"
      - "pods"
      - "pods/status"
      - "services"
      - "endpoints"
      - "namespaces"
      - "events"
      - "resourcequotas"
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - "daemonsets"
      - "deployments"
      - "replicasets"
      - "statefulsets"
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - "jobs"
      - "cronjobs"
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - "ingresses"
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - "horizontalpodautoscalers"
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: newrelic-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: newrelic-infra
subjects:
  - kind: ServiceAccount
    name: newrelic-infra
    namespace: postech
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: newrelic-infra
  namespace: postech
  labels:
    app.kubernetes.io/name: newrelic-infra
    app.kubernetes.io/part-of: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: newrelic-infra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newrelic-infra
        app.kubernetes.io/part-of: monitoring
    spec:
      serviceAccountName: newrelic-infra
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: newrelic-infra
          image: newrelic/infrastructure-bundle:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: NRIA_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: NEW_RELIC_LICENSE_KEY
            - name: NRIA_DISPLAY_NAME
              value: "postech-k8s"
            - name: NRIA_LOG_LEVEL
              value: "INFO"
            - name: NRIA_IS_FORWARD_ONLY
              value: "false"
            - name: NRIA_K8S_EVENT_SERVER
              value: "true"
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: etc
              mountPath: /host/etc
              readOnly: true
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: proc
          hostPath:
            path: /proc
        - name: etc
          hostPath:
            path: /etc
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
