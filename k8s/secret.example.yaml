apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: postech
type: Opaque
# Copie este arquivo para secret.yaml e preencha com os valores reais.
# secret.yaml está no .gitignore — nunca commite com dados reais.
#
# Como gerar cada valor:
#   APP_KEY:    php artisan key:generate --show
#   JWT_SECRET: php artisan jwt:secret --show
#   DB_PASSWORD, MAIL_PASSWORD, MAIL_USERNAME: valores do seu ambiente
stringData:
  APP_KEY: "base64:SUBSTITUA_PELA_CHAVE_GERADA"
  DB_PASSWORD: "SUBSTITUA_PELA_SENHA_DO_BANCO"
  JWT_SECRET: "SUBSTITUA_PELO_JWT_SECRET"
  MAIL_USERNAME: "SUBSTITUA_PELO_EMAIL"
  MAIL_PASSWORD: "SUBSTITUA_PELA_SENHA_DO_EMAIL"
