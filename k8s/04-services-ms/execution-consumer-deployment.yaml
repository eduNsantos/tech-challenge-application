# Substitui o antigo postech-status-consumer: a aplicação passou a ser dona do
# status da O.S. e agora consome apenas os eventos de início/fim de execução do MS.
# No corte, remova o deployment antigo: kubectl delete deployment postech-status-consumer -n postech
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postech-execution-consumer
  namespace: postech
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postech-execution-consumer
  namespace: postech
  labels:
    app: postech-execution-consumer
spec:
  # Uma única réplica processa os eventos de execução em ordem.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postech-execution-consumer
  template:
    metadata:
      labels:
        app: postech-execution-consumer
    spec:
      serviceAccountName: postech-execution-consumer
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: execution-consumer
          image: ghcr.io/edunsantos/tech-challenge-application:latest
          imagePullPolicy: Always
          command: ["php", "artisan", "sqs:consume-service-execution"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
