          maxLength: 100
          description: Marca do veículo
          example: Toyota
        model:
          type: string
          maxLength: 100
          description: Modelo do veículo
          example: Corolla
        year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Ano de fabricação do veículo
          example: 2023
        plate:
          type: string
          pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$'
          description: Placa do veículo no formato ABC1D23
          example: ABC1D23

    AtualizarVeiculoRequest:
      type: object
      required:
        - brand
        - model
        - year
      properties:
        brand:
          type: string
          maxLength: 100
          description: Marca do veículo
          example: Toyota
        model:
          type: string
          maxLength: 100
          description: Modelo do veículo
          example: Corolla XEi
        year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Ano de fabricação do veículo
          example: 2024
