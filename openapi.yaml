openapi: 3.0.3

info:
  title: TechChallenge API
  description: |-
    Documentação da API do TechChallenge.

    ## Autenticação

    A API utiliza **JWT (JSON Web Token)** para autenticação.

    Para acessar endpoints protegidos:
    1. Crie uma conta via `POST /auth/register`
    2. Autentique-se via `POST /auth/login` e obtenha o `access_token`
    3. Envie o token no cabeçalho de todas as requisições protegidas:
       ```
       Authorization: Bearer {access_token}
       ```
  version: 1.0.0
  contact: {}

servers:
  - url: http://localhost:8080/api
    description: Servidor local de desenvolvimento

tags:
  - name: Autenticação
    description: Operações de registro, login, logout e gerenciamento de sessão JWT

paths:

  /auth/register:
    post:
      tags:
        - Autenticação
      summary: Registrar novo usuário
      description: |-
        Cria uma nova conta de usuário no sistema.

        Retorna os dados do usuário criado com status **201 Created**.
        Em caso de falha de validação, retorna os erros com status **400 Bad Request**.
      operationId: auth-register
      requestBody:
        required: true
      content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            example:
              name: João Silva
              email: joao@example.com
              password: senha12345
              password_confirmation: senha12345
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroResponse'
              example:
                message: Novo usuário criado com sucesso
                user:
                  id: 1
                  name: João Silva
                  email: joao@example.com
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
              example:
                email:
                  - O campo e-mail já está em uso.
                password:
                  - O campo senha deve ter no mínimo 8 caracteres.

  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Autenticar usuário
      description: |-
        Autentica o usuário com e-mail e senha e retorna um **token JWT**.

        O `access_token` retornado deve ser usado no cabeçalho `Authorization: Bearer {token}` para acessar rotas protegidas.
      operationId: auth-login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: joao@example.com
              password: senha12345
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                token_type: bearer
                expires_in: 3600
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAutenticacao'
              example:
                message: Credenciais inválidas

  /auth/logout:
    post:
      tags:
        - Autenticação
      summary: Encerrar sessão
      description: |-
        Invalida o token JWT atual, encerrando a sessão do usuário autenticado.

        **Requer autenticação.**
      operationId: auth-logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessão encerrada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Usuário deslogado com sucesso
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /auth/refresh:
    post:
      tags:
        - Autenticação
      summary: Renovar token JWT
      description: |-
        Invalida o token JWT atual e emite um novo token com validade renovada.

        **Requer autenticação.** Utilize esse endpoint para manter a sessão ativa sem precisar fazer login novamente.
      operationId: auth-refresh
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token renovado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                token_type: bearer
                expires_in: 3600
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /auth/me:
    get:
      tags:
        - Autenticação
      summary: Obter dados do usuário autenticado
      description: |-
        Retorna os dados do usuário correspondente ao token JWT informado.

        **Requer autenticação.**
      operationId: auth-me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário retornados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: 1
                name: João Silva
                email: joao@example.com
                created_at: '2026-03-25T12:00:00.000000Z'
                updated_at: '2026-03-25T12:00:00.000000Z'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtido via `POST /auth/login` ou `POST /auth/refresh`

  schemas:

    RegistroRequest:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          maxLength: 255
          description: Nome completo do usuário
          example: João Silva
        email:
          type: string
          format: email
          maxLength: 255
          description: E-mail único do usuário
          example: joao@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Senha (mínimo 8 caracteres)
          example: senha12345
        password_confirmation:
          type: string
          format: password
          description: Confirmação da senha (deve ser igual ao campo `password`)
          example: senha12345

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: E-mail cadastrado
          example: joao@example.com
        password:
          type: string
          format: password
          description: Senha do usuário
          example: senha12345

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Token JWT para autenticação nas demais requisições
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
        token_type:
          type: string
          enum:
            - bearer
          description: Tipo do token
          example: bearer
        expires_in:
          type: integer
          description: Tempo de expiração do token em segundos
          example: 3600

    RegistroResponse:
      type: object
      properties:
        message:
          type: string
          description: Mensagem de confirmação
          example: Novo usuário criado com sucesso
        user:
          $ref: '#/components/schemas/UsuarioBasico'

    Usuario:
      type: object
      properties:
        id:
          type: integer
          description: Identificador único do usuário
          example: 1
        name:
          type: string
          description: Nome do usuário
          example: João Silva
        email:
          type: string
          format: email
          description: E-mail do usuário
          example: joao@example.com
        created_at:
          type: string
          format: date-time
          description: Data de criação da conta
          example: '2026-03-25T12:00:00.000000Z'
        updated_at:
          type: string
          format: date-time
          description: Data da última atualização
          example: '2026-03-25T12:00:00.000000Z'

    UsuarioBasico:
      type: object
      properties:
        id:
          type: integer
          description: Identificador único do usuário
          example: 1
        name:
          type: string
          description: Nome do usuário
          example: João Silva
        email:
          type: string
          format: email
          description: E-mail do usuário
          example: joao@example.com

    ErroValidacao:
      type: object
      description: Mapa de erros de validação por campo
      additionalProperties:
        type: array
        items:
          type: string
      example:
        email:
          - O campo e-mail já está em uso.
        password:
          - O campo senha deve ter no mínimo 8 caracteres.

    ErroAutenticacao:
      type: object
      properties:
        message:
          type: string
          description: Descrição do erro de autenticação
          example: Credenciais inválidas

  responses:
    NaoAutenticado:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroAutenticacao'
          example:
            message: Token inválido ou expirado
