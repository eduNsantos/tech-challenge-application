          description: Ano do veículo
          example: 2023
        vehicle_plate:
          type: string
          maxLength: 10
          pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$'
          description: Placa do veículo
          example: ABC1D23
        services:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemOrdemServico'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ItemOrdemServico'
        send_quote:
          type: boolean
          description: Define se o orçamento deve ser enviado para aprovação no momento da criação
          default: true
          example: true

    AtualizarOrdemServicoRequest:
      type: object
      properties:
        vehicle_brand:
          type: string
          maxLength: 255
          description: Marca do veículo
          example: Toyota
        vehicle_model:
          type: string
          maxLength: 255
          description: Modelo do veículo
          example: Corolla XEi
        vehicle_year:
          type: integer
          minimum: 1900
          description: Ano do veículo
          example: 2024
        vehicle_plate:
          type: string
          maxLength: 10
          pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$'
          description: Placa do veículo
          example: ABC1D23
        services:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemOrdemServico'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ItemOrdemServico'
        status:
          $ref: '#/components/schemas/OrdemServicoStatus'
        send_quote:
          type: boolean
          description: Reenvia orçamento para aprovação
          example: false
        approve_quote:
          type: boolean
