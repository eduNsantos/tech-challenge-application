name: Laravel CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    # 1. Validação e Planejamento do Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.0"

    - name: Terraform Validate & Plan
      run: |
        terraform init -backend=false
        terraform validate

    # 2. Cria o Cluster Kubernetes temporário (Kind)
    - name: Setup Kubernetes Cluster (Kind)
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: laravel-cluster-ci

    # 3. Constroi a imagem Docker exatamente com o nome esperado pelo Kubernetes
    - name: Build Laravel Docker Image
      run: |
        docker build -t techchallenge-1-app-php:v2 -f Dockerfile .

    # 4. Injeta a imagem para dentro do nó do Kind
    - name: Load Image into Kind Cluster
      run: |
        kind load docker-image techchallenge-1-app-php:v2 --name laravel-cluster-ci

    # 5. Valida a sintaxe dos manifestos (Ajuste o caminho se não usar a pasta k8s/)
    - name: Validate K8s Manifests
      run: |
        kubectl apply --dry-run=client -f k8s/app-deployment.yaml

    # 6. Executa o deploy de teste        
    - name: Deploy and Test Laravel App
      run: |        
        kubectl create namespace postech --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f k8s/
        
        echo "Aguardando o MySQL iniciar..."
        kubectl rollout status deployment/mysql -n postech --timeout=60s || true

        echo "Aguardando o container do Laravel ficar disponível..."
        # Espera especificamente o deployment do Laravel (ajuste o nome se for diferente no seu yaml)
        kubectl wait --namespace postech --for=condition=available --timeout=90s deployment/techchallenge-1-app-php || true
        
        echo "=== STATUS ATUAL DOS PODS ==="
        kubectl get pods -n postech
        
        echo "=== EXECUTANDO TESTES DENTRO DO CONTAINER APP ==="
        # FILTRO CORRIGIDO: Busca apenas os pods que pertencem ao deployment da aplicação (evita pods de migrate/jobs)
        APP_POD=$(kubectl get pods -n postech -l app=postech-app -o jsonpath='{.items[0].metadata.name}')
        
        echo "Rodando testes no Pod da Aplicação: $APP_POD"
        kubectl exec -n postech $APP_POD -c app -- php artisan test

