
name: Laravel CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    # 1. Validação e Planejamento do Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.0"

    - name: Terraform Validate & Plan
      run: |
        terraform init -backend=false
        terraform validate
    # 2. Cria o Cluster Kubernetes temporário (Kind)
    - name: Setup Kubernetes Cluster (Kind)
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: laravel-cluster-ci

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Constroi a imagem Docker exatamente com o nome esperado pelo Kubernetes
    - name: Build Laravel Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        tags: techchallenge-1-app-php:v2
        load: true
        build-args: |
          NEW_RELIC_ENABLED=false
          NEW_RELIC_APP_NAME=${{ secrets.NEW_RELIC_APP_NAME || 'Tech Challenge POS' }}
          NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY || secrets.NEW_RELIC_KEY || secrets.newrelic_key }}
          NEW_RELIC_DAEMON_ADDRESS=${{ secrets.NEW_RELIC_DAEMON_ADDRESS || 'newrelic:31339' }}
          NEW_RELIC_KEY=${{ secrets.NEW_RELIC_KEY || secrets.newrelic_key || secrets.P }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 4. Injeta a imagem para dentro do nó do Kind
    - name: Load Image into Kind Cluster
      run: |
        kind load docker-image techchallenge-1-app-php:v2 --name laravel-cluster-ci
    # 5. Valida a sintaxe dos manifestos (Ajuste o caminho se não usar a pasta k8s/)
    - name: Validate K8s Manifests
      run: |
        kubectl apply --dry-run=client -f k8s/02-app/app-deployment.yaml
    # 6. Executa o deploy de teste
    - name: Deploy and Test Laravel App
      run: |
        set -euo pipefail
        export CI_IMAGE=techchallenge-1-app-php:v2
        debug_kubernetes_state() {
          echo "=== DEBUG: PODS NO NAMESPACE postech ==="
          kubectl get pods -n postech -o wide || true
          echo "=== DEBUG: PVCs NO NAMESPACE postech ==="
          kubectl get pvc -n postech -o wide || true
          echo "=== DEBUG: EVENTOS RECENTES NO NAMESPACE postech ==="
          kubectl get events -n postech --sort-by=.lastTimestamp | tail -n 40 || true
        }
        debug_container_logs() {
          local selector="$1"
          echo "=== DEBUG: STATUS DOS CONTAINERS ($selector) ==="
          kubectl get pods -n postech -l "$selector" \
            -o 'jsonpath={range .items[*]}{.metadata.name}{"\n"}{range .status.initContainerStatuses[*]}{"  init "}{.name}{" waiting="}{.state.waiting.reason}{" terminated="}{.state.terminated.reason}{" restarts="}{.restartCount}{"\n"}{end}{range .status.containerStatuses[*]}{"  container "}{.name}{" waiting="}{.state.waiting.reason}{" terminated="}{.state.terminated.reason}{" restarts="}{.restartCount}{"\n"}{end}{end}' || true
          echo "=== DEBUG: LOGS ATUAIS ($selector) ==="
          kubectl logs -n postech -l "$selector" --all-containers=true --prefix=true --tail=100 || true
          echo "=== DEBUG: LOGS ANTERIORES, SE HOUVER REINICIOS ($selector) ==="
          kubectl logs -n postech -l "$selector" --all-containers=true --prefix=true --previous --tail=100 || true
        }
        kubectl create namespace postech --dry-run=client -o yaml | kubectl apply -f -
        echo "=== OTIMIZANDO MANIFESTOS PARA O AMBIENTE DE CI ==="
        MYSQL_FILE=$(ls k8s/03-database/* 2>/dev/null | head -n 1)
        echo "Arquivo do MySQL encontrado: $MYSQL_FILE"
        # Remove as probes do MySQL para evitar reinícios por falso-positivo no ambiente do CI
        yq eval 'del(.spec.template.spec.containers[0].livenessProbe)' -i "$MYSQL_FILE"
        yq eval 'del(.spec.template.spec.containers[0].readinessProbe)' -i "$MYSQL_FILE"
        # Remove o init container do Laravel para gerenciarmos a espera de forma direta
        yq eval 'del(.spec.template.spec.initContainers)' -i k8s/02-app/app-deployment.yaml
        # Forca os manifestos a usar a imagem carregada no Kind, sem pull externo
        yq eval '.spec.template.spec.imagePullSecrets = []' -i k8s/02-app/app-deployment.yaml
        yq eval '.spec.template.spec.containers[0].image = env(CI_IMAGE)' -i k8s/02-app/app-deployment.yaml
        yq eval '.spec.template.spec.containers[0].imagePullPolicy = "IfNotPresent"' -i k8s/02-app/app-deployment.yaml
        yq eval '.spec.template.spec.imagePullSecrets = []' -i k8s/02-app/migrate-job.yaml
        yq eval '.spec.template.spec.containers[0].image = env(CI_IMAGE)' -i k8s/02-app/migrate-job.yaml
        yq eval '.spec.template.spec.containers[0].imagePullPolicy = "IfNotPresent"' -i k8s/02-app/migrate-job.yaml
        echo "Aplicando todos os manifestos no Kubernetes..."
        kubectl apply -f k8s/00-namespaces/
        kubectl apply -f k8s/01-config/
        echo "Criando credenciais temporarias para o CI..."
        python3 - <<'PY' | kubectl create -f -
        import base64
        import json
        import secrets

        password = secrets.token_hex(32)
        print(json.dumps({
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": "app-secret", "namespace": "postech"},
            "type": "Opaque",
            "stringData": {
                "APP_KEY": "base64:" + base64.b64encode(secrets.token_bytes(32)).decode(),
                "JWT_SECRET": secrets.token_hex(32),
                "DB_PASSWORD": password,
                "MYSQL_PASSWORD": password,
            },
        }))
        PY
        kubectl apply -f k8s/02-app/
        kubectl apply -f k8s/03-database/
        echo "=== AGUARDANDO O SOCKET DO MYSQL ABRIR ==="
        # Aguarda dinamicamente o pod do MySQL ser criado e iniciar o processo do container
        if ! kubectl wait --namespace postech --for=jsonpath='{.status.phase}'=Running pod -l app=mysql --timeout=90s; then
          echo "MySQL nao chegou ao estado Running; coletando diagnostico."
          debug_kubernetes_state
          debug_container_logs 'app=mysql'
          exit 1
        fi
        MYSQL_POD=$(kubectl get pods -n postech -l app=mysql -o jsonpath='{.items[0].metadata.name}')
        echo "Aguardando MySQL aceitar conexoes..."
        for i in $(seq 1 45); do
          if kubectl exec -n postech "$MYSQL_POD" -- sh -lc 'mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1"' >/dev/null 2>&1; then
            echo "MySQL pronto."
            break
          fi
          if [ "$i" -eq 45 ]; then
            echo "Timeout aguardando MySQL ficar pronto."
            debug_kubernetes_state
            debug_container_logs 'app=mysql'
            exit 1
          fi
          sleep 2
        done
        echo "=== AGUARDANDO O LARAVEL FICAR PRONTO ==="
        if ! kubectl wait --namespace postech --for=condition=ready pod -l 'app=postech-app,component!=migrate' --timeout=90s; then
          echo "Aplicacao nao ficou Ready; coletando diagnostico."
          debug_kubernetes_state
          debug_container_logs 'app=postech-app'
          exit 1
        fi
        echo "=== STATUS ATUAL DOS PODS ==="
        kubectl get pods -n postech
        echo "=== COLETANDO NOME DO POD DO LARAVEL ==="
        APP_POD=$(kubectl get pods -n postech -l 'app=postech-app,component!=migrate' -o jsonpath='{.items[0].metadata.name}')
        echo "Pod detectado: $APP_POD"
        echo "=== COPIANDO PASTA DE TESTES PARA O POD ==="
        kubectl cp tests/ postech/$APP_POD:/var/www/html/tests -c app
        echo "=== PREPARANDO BANCO E EXECUTANDO OS TESTES ==="
        # 1. Executa as migrações usando o host do banco correto
        kubectl exec -n postech "$APP_POD" -c app -- env \
          DB_CONNECTION=mysql \
          DB_HOST=mysql \
          DB_PORT=3306 \
          php artisan migrate --force
        # 2. Executa os testes com as credenciais temporarias do app-secret
        kubectl exec -n postech "$APP_POD" -c app -- env \
          DB_CONNECTION=mysql \
          DB_HOST=mysql \
          DB_PORT=3306 \
          php -d newrelic.enabled=0 ./vendor/bin/phpunit --no-configuration tests/
