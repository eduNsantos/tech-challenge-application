name: Laravel CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tech_challenge
          MYSQL_USER: tech_user
          MYSQL_PASSWORD: tech_pass
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Validação do Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.0"

    - name: Terraform Validate
      run: |
        cd k8s && terraform init -backend=false && terraform validate && cd ..
        cd tech-challenge-services-ms/infra && terraform init -backend=false && terraform validate

    # 2. Build e teste da imagem PHP
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Laravel Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        tags: techchallenge-app:test
        load: true
        build-args: |
          NEW_RELIC_ENABLED=${{ secrets.NEW_RELIC_ENABLED || 'false' }}
          NEW_RELIC_APP_NAME=${{ secrets.NEW_RELIC_APP_NAME || 'Tech Challenge POS' }}
          NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY || secrets.NEW_RELIC_KEY || '' }}
          NEW_RELIC_DAEMON_ADDRESS=${{ secrets.NEW_RELIC_DAEMON_ADDRESS || 'newrelic:31339' }}
          NEW_RELIC_KEY=${{ secrets.NEW_RELIC_KEY || '' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Install Dependencies
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          techchallenge-app:test \
          bash -c "composer install --no-interaction --prefer-dist --optimize-autoloader"

    - name: Setup Laravel Environment
      run: |
        cp .env.example .env
        # Define configurações do teste
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          -e DB_CONNECTION=mysql \
          -e DB_HOST=mysql \
          -e DB_PORT=3306 \
          -e DB_DATABASE=tech_challenge \
          -e DB_USERNAME=root \
          -e DB_PASSWORD=root \
          -e APP_KEY="${{ secrets.APP_KEY }}" \
          -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          techchallenge-app:test \
          php artisan key:generate --force

    - name: Wait for MySQL
      run: |
        for i in {1..30}; do
          echo "Tentativa $i/30..."
          mysql -h 127.0.0.1 -u root -p"root" -e "SELECT 1" && echo "MySQL está pronto!" && exit 0
          sleep 2
        done
        echo "MySQL não respondeu a tempo"
        exit 1
      env:
        MYSQL_PWD: root

    - name: Run Database Migrations
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          --network host \
          -e DB_CONNECTION=mysql \
          -e DB_HOST=127.0.0.1 \
          -e DB_PORT=3306 \
          -e DB_DATABASE=tech_challenge \
          -e DB_USERNAME=root \
          -e DB_PASSWORD=root \
          -e APP_KEY="${{ secrets.APP_KEY }}" \
          -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          techchallenge-app:test \
          php artisan migrate --force

    - name: Run Tests
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          --network host \
          -e DB_CONNECTION=mysql \
          -e DB_HOST=127.0.0.1 \
          -e DB_PORT=3306 \
          -e DB_DATABASE=tech_challenge \
          -e DB_USERNAME=root \
          -e DB_PASSWORD=root \
          -e APP_KEY="${{ secrets.APP_KEY }}" \
          -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          techchallenge-app:test \
          ./vendor/bin/phpunit --no-configuration tests/


















