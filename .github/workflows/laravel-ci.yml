name: Laravel CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # JOB 1: TESTES DA APLICAÇÃO (PHP / LARAVEL)
  # ----------------------------------------------------
  laravel-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Ajuste para a versão do seu projeto
        extensions: mbstring, xml, ctype, iconv, mysql, bcmath
        coverage: none

    - name: Instalar Dependências do Composer
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Copiar arquivo .env de teste
      run: cp .env.example .env

    - name: Gerar chave da aplicação
      run: php artisan key:generate

    - name: Executar Testes (Pest ou PHPUnit)
      run: php artisan test

  # ----------------------------------------------------
  # JOB 2: VALIDAÇÃO DO TERRAFORM
  # ----------------------------------------------------
  terraform-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Inicializar Terraform (baixa provedores)
      run: terraform -chdir=./terraform init -backend=false

    - name: Validar Sintaxe do Código
      run: terraform -chdir=./terraform validate

  # ----------------------------------------------------
  # JOB 3: VALIDAÇÃO DOS MANIFESTOS KUBERNETES
  # ----------------------------------------------------
  kubernetes-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Validar arquivos YAML do K8s (Dry-run com Kubeval ou Kube-linter)
      # Usamos uma ferramenta simples para garantir que os arquivos k8s não possuem erros de sintaxe
      run: |
        sudo wget -O /usr/local/bin/kubeval https://github.com
        # Nota: Caso use outra ferramenta ou queira apenas um check básico de sintaxe com python/yq:
        # Se você não tiver ferramentas extras, um "kubectl apply --dry-run=client" também resolve se houvesse cluster,
        # mas como estamos testando na nuvem sem o minikube conectado ainda, validamos apenas a formatação do yaml:
        python3 -c "import yaml, os; [yaml.safe_load(open(os.path.join('./k8s', f))) for f in os.listdir('./k8s') if f.endswith('.yml') or f.endswith('.yaml')]"
