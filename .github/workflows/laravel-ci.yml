name: Laravel CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    # 1. Validação e Planejamento do Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.0"

    - name: Terraform Validate & Plan
      run: |
        terraform init -backend=false
        terraform validate

    # 2. Cria o Cluster Kubernetes temporário (Kind)
    - name: Setup Kubernetes Cluster (Kind)
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: laravel-cluster-ci

    # 3. Constroi a imagem Docker exatamente com o nome esperado pelo Kubernetes
    - name: Build Laravel Docker Image
      run: |
        docker build -t techchallenge-1-app-php:v2 -f Dockerfile .

    # 4. Injeta a imagem para dentro do nó do Kind
    - name: Load Image into Kind Cluster
      run: |
        kind load docker-image techchallenge-1-app-php:v2 --name laravel-cluster-ci

    # 5. Valida a sintaxe dos manifestos (Ajuste o caminho se não usar a pasta k8s/)
    - name: Validate K8s Manifests
      run: |
        kubectl apply --dry-run=client -f k8s/app-deployment.yaml

    # 6. Executa o deploy de teste        
    - name: Deploy and Test Laravel App
      run: |        
        kubectl create namespace postech --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f k8s/
        
        echo "=== REMOVENDO TRAVA DO INIT CONTAINER NO CI ==="
        # Remove dinamicamente o initContainer para o App não ficar preso esperando o status oficial do MySQL
        kubectl patch deployment postech-app -n postech --type=json -p='[{"op": "remove", "path": "/spec/template/spec/initContainers"}]' || true

        echo "Aguardando o banco e a aplicação estabilizarem (60 segundos)..."
        # Damos um tempo fixo para o MySQL parar de reiniciar e o Laravel subir o servidor
        sleep 60
        
        echo "=== STATUS DOS PODS APÓS JANELA DE ESPERA ==="
        kubectl get pods -n postech
        
        echo "=== LOGS REAIS DO CONTAINER LARAVEL ==="
        APP_POD=$(kubectl get pods -n postech -l app=postech-app -o jsonpath='{.items[0].metadata.name}')
        kubectl logs -n postech $APP_POD -c app --tail=30 || true
        
        echo "=== EXECUTANDO OS TESTES DO LARAVEL ==="
        kubectl exec -n postech $APP_POD -c app -- php artisan test







