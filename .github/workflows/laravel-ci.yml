name: Laravel CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Validação do Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.0"

    - name: Terraform Validate
      run: |
        cd k8s && terraform init -backend=false && terraform validate && cd ..
        cd tech-challenge-services-ms/infra && terraform init -backend=false && terraform validate

    # 2. Build imagem PHP otimizada para testes (sem New Relic)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Laravel Test Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.test
        tags: techchallenge-app:test
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Setup and Run Tests
      run: |
        set -euo pipefail
        
        echo "=== Step 1: Install Dependencies ==="
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          techchallenge-app:test \
          composer install --no-interaction --prefer-dist --optimize-autoloader
        
        echo "=== Step 2: Setup .env for Testing ==="
        cp .env.testing .env
        
        echo "=== Step 3: Generate APP_KEY ==="
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          -e APP_ENV=testing \
          -e DB_CONNECTION=sqlite \
          -e APP_KEY="${{ secrets.APP_KEY }}" \
          -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          techchallenge-app:test \
          php artisan key:generate --force
        
        echo "=== Step 4: Run Database Migrations (SQLite in-memory) ==="
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          -e APP_ENV=testing \
          -e DB_CONNECTION=sqlite \
          -e DB_DATABASE=:memory: \
          -e APP_KEY="${{ secrets.APP_KEY }}" \
          -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          techchallenge-app:test \
          php artisan migrate --force
        
        echo "=== Step 5: Run Tests ==="
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          -e APP_ENV=testing \
          -e DB_CONNECTION=sqlite \
          -e DB_DATABASE=:memory: \
          -e APP_KEY="${{ secrets.APP_KEY }}" \
          -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          techchallenge-app:test \
          ./vendor/bin/phpunit --no-configuration tests/
