name: Deploy to local Minikube

on:
  workflow_run:
    workflows: ["Build and Publish Docker image (GHCR)"]
    types: [completed]
    branches: [main, minikube]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NAMESPACE: postech
  TF_STATE_FILE: /home/eduardo/actions-runner/terraform-state/techchallenge-minikube.tfstate

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check minikube status
        run: |
          minikube status
          kubectl config use-context minikube

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Resolve image tag
        id: image
        run: echo "tag=latest" >> "$GITHUB_OUTPUT"
      - name: Terraform init
        run: |
          mkdir -p "$(dirname "$TF_STATE_FILE")"
          terraform -chdir=infra init

      - name: Terraform import existing base resources
        run: |
          set -euo pipefail
          cd infra

          touch "$TF_STATE_FILE"

          if kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            if ! terraform state list -state="$TF_STATE_FILE" | grep -q '^kubernetes_namespace_v1.postech$'; then
              terraform import -state="$TF_STATE_FILE" kubernetes_namespace_v1.postech "$NAMESPACE" || true
            fi
          fi

          if kubectl get pv mysql-pv >/dev/null 2>&1; then
            if ! terraform state list -state="$TF_STATE_FILE" | grep -q '^kubernetes_persistent_volume_v1.mysql$'; then
              terraform import -state="$TF_STATE_FILE" kubernetes_persistent_volume_v1.mysql mysql-pv || true
            fi
          fi

      - name: Terraform apply (auto-approve)
        env:
          TF_VAR_app_key: ${{ secrets.APP_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_mail_username: ${{ secrets.MAIL_USERNAME }}
          TF_VAR_mail_password: ${{ secrets.MAIL_PASSWORD }}
          TF_VAR_ghcr_username: ${{ secrets.GHCR_USERNAME }}
          TF_VAR_ghcr_token: ${{ secrets.GHCR_TOKEN }}
          TF_VAR_ghcr_email: ${{ secrets.GHCR_EMAIL }}
        run: |
          IMAGE_REPO="ghcr.io/edunsantos/tech-challenge-application"
          ROLLOUT_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          cd infra
          terraform apply -auto-approve \
            -state="$TF_STATE_FILE" \
            -var="image_tag=${{ steps.image.outputs.tag }}" \
            -var="image_repository=${IMAGE_REPO}" \
            -var="rollout_id=${ROLLOUT_ID}" \
            -var="deploy_metrics_server=false"

      - name: Show access URLs
        run: |
          set -euo pipefail
          for svc in postech-app swagger-ui; do
            ip=$(kubectl get svc "$svc" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            port=$(kubectl get svc "$svc" -n "$NAMESPACE" -o jsonpath='{.spec.ports[0].port}')
            if [ -z "$ip" ]; then
              echo "⚠️  $svc: EXTERNAL-IP ainda pendente (precisa de 'minikube tunnel' ativo no runner)."
            else
              echo "$svc: http://$ip:$port"
            fi
          done