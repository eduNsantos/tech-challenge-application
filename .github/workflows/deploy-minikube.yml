name: Deploy to local Minikube

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NAMESPACE: postech

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check minikube status
        run: |
          minikube status
          kubectl config use-context minikube

      - name: Apply Kubernetes manifests
        run: |
          set -euo pipefail
          kubectl apply -f k8s/00-namespaces/
          kubectl apply -f k8s/01-config/
          kubectl apply -f k8s/02-app/
          kubectl apply -f k8s/03-database/

      - name: Deploy New Relic Kubernetes integration
        run: |
          set -euo pipefail
          helm repo add newrelic https://helm-charts.newrelic.com || true
          helm repo update

          NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}"

          helm upgrade --install newrelic-bundle \
            newrelic/nri-bundle \
            --namespace "$NAMESPACE" \
            -f values-newrelic.yaml \
            --set global.licenseKey="$NEW_RELIC_LICENSE_KEY"

      - name: Show access URLs
        run: |
          set -euo pipefail
          for svc in postech-app swagger-ui; do
            ip=$(kubectl get svc "$svc" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            port=$(kubectl get svc "$svc" -n "$NAMESPACE" -o jsonpath='{.spec.ports[0].port}')
            if [ -z "$ip" ]; then
              echo "⚠️  $svc: EXTERNAL-IP ainda pendente (precisa de 'minikube tunnel' ativo no runner)."
            else
              echo "$svc: http://$ip:$port"
            fi
          done

      - name: Trigger tech-challenge-lambda-functions CI/CD
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.LAMBDA_REPO_TOKEN }}
          repository: edunsantos/tech-challenge-lambda-functions
          event-type: deploy-lambda-auth
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}"
            }