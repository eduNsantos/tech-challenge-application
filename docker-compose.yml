services:
  app-php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8000
    working_dir: /var/www/html
    user: 1000:1000
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - app_network
    command: "php artisan serve --host=0.0.0.0"
  # web-nginx:
  #   image: nginx:latest
  #   ports:
  #     - 8080:80
  #   volumes:
  #     - ./site.conf:/etc/nginx/conf.d/default.conf
  #     - .:/var/www/html
  #   restart: always
  #   depends_on:
  #     - app-php
  #   networks:
  #     - app_network
  db:
    image: mysql:8.0
    ports:
      - 3306:3306
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - 8082:8080
    environment:
      SWAGGER_JSON: /app/openapi.yaml
    volumes:
      - ./openapi.yaml:/app/openapi.yaml
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge

